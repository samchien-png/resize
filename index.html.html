<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>批次圖片縮圖工具</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #6b7485;
      --line: #e5eaf2;
      --primary: #315efb;
      --primary-dark: #244bd5;
      --success: #16865b;
      --danger: #c43d4b;
      --shadow: 0 14px 40px rgba(34, 53, 87, .10);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #f7f9fd 0%, #eef3fb 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 1120px; margin: 0 auto; padding: 34px 20px 50px; }
    .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 38px); letter-spacing: -.03em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 15px; }
    .privacy { color: var(--success); font-size: 13px; white-space: nowrap; }
    .panel { background: var(--panel); border: 1px solid rgba(229, 234, 242, .95); border-radius: 20px; box-shadow: var(--shadow); }
    .controls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 20px; margin-bottom: 18px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field label { font-size: 13px; font-weight: 700; color: #4e586a; }
    .field input[type="number"], .field select {
      width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; color: var(--text); background: #fbfcfe; outline: none;
    }
    .field input[type="number"]:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(49, 94, 251, .12); }
    .range-wrap { display: flex; align-items: center; gap: 10px; height: 42px; }
    .range-wrap input { flex: 1; accent-color: var(--primary); }
    .range-value { min-width: 48px; color: var(--primary); font-weight: 800; text-align: right; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding-top: 3px; border-top: 1px solid var(--line); }
    .btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 800; transition: .18s ease; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { color: #fff; background: var(--primary); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-soft { color: #3b4658; background: #eef2f8; }
    .btn-soft:hover:not(:disabled) { background: #e5eaf3; }
    .btn-success { color: #fff; background: var(--success); margin-left: auto; }
    .btn-success:hover:not(:disabled) { background: #0f704b; transform: translateY(-1px); }
    .dropzone { padding: 34px 20px; margin-bottom: 18px; border: 2px dashed #b8c6e5; box-shadow: none; text-align: center; background: rgba(255,255,255,.72); transition: .18s ease; }
    .dropzone.dragover { border-color: var(--primary); background: #eef3ff; transform: scale(1.005); }
    .drop-icon { font-size: 34px; margin-bottom: 8px; }
    .drop-title { font-size: 17px; font-weight: 800; margin-bottom: 5px; }
    .drop-help { color: var(--muted); font-size: 13px; margin-bottom: 15px; }
    #fileInput { display: none; }
    .summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 2px 12px; color: var(--muted); font-size: 14px; }
    .summary strong { color: var(--text); }
    .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .empty { padding: 44px 20px; color: var(--muted); text-align: center; }
    .card { overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 25px rgba(34, 53, 87, .06); }
    .preview { height: 210px; display: flex; align-items: center; justify-content: center; padding: 12px; background: repeating-conic-gradient(#f2f4f8 0 25%, #fff 0 50%) 50% / 18px 18px; }
    .preview img { max-width: 100%; max-height: 100%; display: block; object-fit: contain; border-radius: 8px; }
    .card-body { padding: 14px 15px 15px; }
    .filename { overflow: hidden; margin-bottom: 8px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .status { min-height: 20px; margin: 9px 0 12px; color: var(--primary); font-size: 13px; font-weight: 700; }
    .status.done { color: var(--success); }
    .status.error { color: var(--danger); }
    .card-actions { display: flex; gap: 8px; }
    .card-actions .btn { flex: 1; padding: 9px 10px; font-size: 13px; }
    .progress { height: 7px; overflow: hidden; margin-top: 15px; border-radius: 99px; background: #e9edf5; }
    .progress > span { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #315efb, #6b8bff); transition: width .2s ease; }
    .footer-note { margin-top: 22px; color: var(--muted); font-size: 12px; line-height: 1.6; text-align: center; }

    @media (max-width: 760px) {
      .app { padding: 24px 14px 38px; }
      .hero { display: block; }
      .privacy { display: block; margin-top: 10px; }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 16px; }
      .actions { flex-wrap: wrap; }
      .btn-success { width: 100%; margin-left: 0; }
    }
    @media (max-width: 430px) {
      .controls { grid-template-columns: 1fr; }
      .actions .btn { flex: 1; }
      .results { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div>
        <h1>批次圖片縮圖工具</h1>
        <p class="subtitle">拖曳或選取多張圖片，自動壓縮到指定大小內。</p>
      </div>
      <div class="privacy">🔒 圖片只在你的瀏覽器處理，不會上傳</div>
    </section>

    <section class="panel controls" aria-label="輸出設定">
      <div class="field">
        <label for="maxSize">每張上限（KB）</label>
        <input id="maxSize" type="number" min="1" max="10000" value="500">
        <div class="hint">預設 500 KB（1 KB = 1024 bytes）</div>
      </div>
      <div class="field">
        <label for="maxSide">最長邊（px）</label>
        <input id="maxSide" type="number" min="0" max="20000" value="1920">
        <div class="hint">填 0 代表不限制尺寸</div>
      </div>
      <div class="field">
        <label for="format">輸出格式</label>
        <select id="format">
          <option value="auto">自動（推薦）</option>
          <option value="jpeg">JPEG（相容性最佳）</option>
          <option value="webp">WebP（檔案較小）</option>
          <option value="png">PNG（保留透明背景）</option>
        </select>
        <div class="hint">自動模式會優先使用 JPEG 或 WebP</div>
      </div>
      <div class="field">
        <label for="quality">初始品質</label>
        <div class="range-wrap">
          <input id="quality" type="range" min="0.4" max="1" step="0.05" value="0.85">
          <span class="range-value" id="qualityValue">85%</span>
        </div>
        <div class="hint">工具會自動降低品質或尺寸以符合上限</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="chooseBtn" type="button">選擇圖片</button>
        <button class="btn btn-soft" id="clearBtn" type="button" disabled>清除全部</button>
        <button class="btn btn-success" id="downloadAllBtn" type="button" disabled>下載全部圖片（ZIP）</button>
      </div>
    </section>

    <label class="panel dropzone" id="dropzone" for="fileInput">
      <div class="drop-icon">🖼️</div>
      <div class="drop-title">把圖片拖到這裡</div>
      <div class="drop-help">支援 JPG、PNG、WebP、GIF（GIF 會輸出第一幀）</div>
      <span class="btn btn-primary">選取圖片檔案</span>
      <input id="fileInput" type="file" accept="image/*" multiple>
    </label>

    <div class="summary" id="summary" hidden>
      <span>已加入 <strong id="count">0</strong> 張圖片</span>
      <span id="progressText">等待處理</span>
    </div>
    <section class="results" id="results">
      <div class="panel empty" id="emptyState">選取圖片後，處理結果會顯示在這裡。</div>
    </section>
    <div class="footer-note">所有處理都在本機瀏覽器完成；關閉頁面後，瀏覽器不會保留這些圖片。</div>
  </main>

  <script>
    (() => {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const fileInput = $('fileInput');
      const dropzone = $('dropzone');
      const results = $('results');
      const emptyState = $('emptyState');
      const summary = $('summary');
      const count = $('count');
      const progressText = $('progressText');
      const clearBtn = $('clearBtn');
      const downloadAllBtn = $('downloadAllBtn');
      const qualityInput = $('quality');
      const qualityValue = $('qualityValue');
      const items = [];

      qualityInput.addEventListener('input', () => {
        qualityValue.textContent = Math.round(Number(qualityInput.value) * 100) + '%';
      });

      $('chooseBtn').addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', () => {
        addFiles([...fileInput.files]);
        fileInput.value = '';
      });

      ['dragenter', 'dragover'].forEach((eventName) => {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.add('dragover');
        });
      });
      ['dragleave', 'drop'].forEach((eventName) => {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.remove('dragover');
        });
      });
      dropzone.addEventListener('drop', (event) => addFiles([...event.dataTransfer.files]));

      clearBtn.addEventListener('click', () => {
        items.forEach((item) => {
          if (item.originalUrl) URL.revokeObjectURL(item.originalUrl);
          if (item.outputUrl) URL.revokeObjectURL(item.outputUrl);
        });
        items.length = 0;
        results.innerHTML = '';
        results.appendChild(emptyState);
        emptyState.hidden = false;
        summary.hidden = true;
        clearBtn.disabled = true;
        downloadAllBtn.disabled = true;
      });

      downloadAllBtn.addEventListener('click', async () => {
        const ready = items.filter((item) => item.blob);
        if (!ready.length) return;
        downloadAllBtn.disabled = true;
        downloadAllBtn.textContent = '正在建立 ZIP…';
        try {
          const usedNames = new Set();
          const entries = ready.map((item) => ({
            name: uniqueName(item.outputName, usedNames),
            blob: item.blob
          }));
          const zipBlob = await buildZip(entries);
          downloadBlob(zipBlob, 'resized-images.zip');
        } catch (error) {
          alert('建立 ZIP 失敗：' + (error.message || error));
        } finally {
          downloadAllBtn.disabled = false;
          downloadAllBtn.textContent = '下載全部圖片（ZIP）';
        }
      });

      async function addFiles(files) {
        const imageFiles = files.filter((file) => file.type.startsWith('image/'));
        if (!imageFiles.length) {
          if (files.length) alert('請選擇圖片檔案。');
          return;
        }
        if (!items.length) results.innerHTML = '';
        emptyState.hidden = true;
        summary.hidden = false;
        imageFiles.forEach((file) => {
          const item = createItem(file);
          items.push(item);
          results.appendChild(item.card);
        });
        updateSummary();
        for (const item of items.slice(-imageFiles.length)) await processItem(item);
        updateSummary();
      }

      function createItem(file) {
        const card = document.createElement('article');
        card.className = 'card';
        const preview = document.createElement('div');
        preview.className = 'preview';
        const img = document.createElement('img');
        img.alt = file.name;
        const originalUrl = URL.createObjectURL(file);
        img.src = originalUrl;
        preview.appendChild(img);

        const body = document.createElement('div');
        body.className = 'card-body';
        const filename = document.createElement('div');
        filename.className = 'filename';
        filename.title = file.name;
        filename.textContent = file.name;
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = formatBytes(file.size) + ' · 原圖讀取中…';
        const status = document.createElement('div');
        status.className = 'status';
        status.textContent = '準備處理…';
        const cardActions = document.createElement('div');
        cardActions.className = 'card-actions';
        const downloadBtn = document.createElement('button');
        downloadBtn.type = 'button';
        downloadBtn.className = 'btn btn-soft';
        downloadBtn.textContent = '下載這張';
        downloadBtn.disabled = true;
        downloadBtn.addEventListener('click', () => downloadBlob(item.blob, item.outputName));
        cardActions.appendChild(downloadBtn);
        const progress = document.createElement('div');
        progress.className = 'progress';
        const progressBar = document.createElement('span');
        progress.appendChild(progressBar);

        body.append(filename, meta, status, cardActions, progress);
        card.append(preview, body);
        const item = { file, card, img, originalUrl, outputUrl: '', blob: null, outputName: '', meta, status, downloadBtn, progressBar };
        return item;
      }

      async function processItem(item) {
        item.status.className = 'status';
        item.status.textContent = '正在處理…';
        item.progressBar.style.width = '20%';
        try {
          const image = await loadImage(item.file);
          const maxSide = Math.max(0, Number($('maxSide').value) || 0);
          const maxBytes = Math.max(1, Number($('maxSize').value) || 500) * 1024;
          const initialQuality = Math.min(1, Math.max(.4, Number(qualityInput.value) || .85));
          const selectedFormat = $('format').value;
          const mime = selectedFormat === 'jpeg' ? 'image/jpeg' : selectedFormat === 'webp' ? 'image/webp' : selectedFormat === 'png' ? 'image/png' : (supportsWebP() ? 'image/webp' : 'image/jpeg');
          let scale = maxSide > 0 ? Math.min(1, maxSide / Math.max(image.width, image.height)) : 1;
          let quality = initialQuality;
          let blob = null;
          let width = Math.max(16, Math.round(image.width * scale));
          let height = Math.max(16, Math.round(image.height * scale));

          for (let attempt = 0; attempt < 40; attempt++) {
            width = Math.max(16, Math.round(image.width * scale));
            height = Math.max(16, Math.round(image.height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d', { alpha: mime !== 'image/jpeg' });
            if (mime === 'image/jpeg') {
              context.fillStyle = '#ffffff';
              context.fillRect(0, 0, width, height);
            }
            context.imageSmoothingEnabled = true;
            context.imageSmoothingQuality = 'high';
            context.drawImage(image.source, 0, 0, width, height);
            blob = await canvasToBlob(canvas, mime, quality);
            item.progressBar.style.width = Math.min(92, 24 + attempt * 2) + '%';
            if (blob.size <= maxBytes) break;
            if (mime !== 'image/png' && quality > .38) {
              quality = Math.max(.32, quality - .08);
            } else {
              scale *= mime === 'image/png' ? .78 : .82;
              quality = initialQuality;
            }
          }

          if (!blob || blob.size > maxBytes) throw new Error('圖片內容較複雜，請提高檔案上限或降低最長邊。');
          item.blob = blob;
          item.outputName = makeOutputName(item.file.name, mime);
          if (item.outputUrl) URL.revokeObjectURL(item.outputUrl);
          item.outputUrl = URL.createObjectURL(blob);
          item.img.src = item.outputUrl;
          item.meta.textContent = formatBytes(item.file.size) + ' → ' + formatBytes(blob.size) + ' · ' + width + ' × ' + height;
          item.status.className = 'status done';
          item.status.textContent = '完成 · 已符合 ' + formatBytes(maxBytes) + ' 上限';
          item.downloadBtn.disabled = false;
          item.progressBar.style.width = '100%';
        } catch (error) {
          item.status.className = 'status error';
          item.status.textContent = '處理失敗：' + (error.message || error);
          item.progressBar.style.width = '0%';
        } finally {
          updateSummary();
        }
      }

      function updateSummary() {
        count.textContent = items.length;
        const done = items.filter((item) => item.blob).length;
        const failed = items.filter((item) => item.status.classList.contains('error')).length;
        progressText.textContent = done === items.length ? '全部完成' : ('已完成 ' + done + '/' + items.length + (failed ? ' · ' + failed + ' 張失敗' : ''));
        clearBtn.disabled = items.length === 0;
        downloadAllBtn.disabled = done === 0;
      }

      function loadImage(file) {
        return new Promise((resolve, reject) => {
          const sourceUrl = URL.createObjectURL(file);
          const image = new Image();
          image.onload = () => {
            URL.revokeObjectURL(sourceUrl);
            resolve({ source: image, width: image.naturalWidth, height: image.naturalHeight });
          };
          image.onerror = () => {
            URL.revokeObjectURL(sourceUrl);
            reject(new Error('無法讀取圖片'));
          };
          image.src = sourceUrl;
        });
      }

      function canvasToBlob(canvas, mime, quality) {
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('瀏覽器不支援此輸出格式')), mime, quality);
        });
      }

      function supportsWebP() {
        const canvas = document.createElement('canvas');
        return canvas.toDataURL('image/webp').startsWith('data:image/webp');
      }

      function makeOutputName(name, mime) {
        const base = name.replace(/\.[^.]+$/, '') || 'image';
        const ext = mime === 'image/png' ? 'png' : mime === 'image/webp' ? 'webp' : 'jpg';
        return base + '_resized.' + ext;
      }

      function formatBytes(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(bytes < 10240 ? 1 : 0) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
      }

      function downloadBlob(blob, name) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function uniqueName(name, used) {
        const dot = name.lastIndexOf('.');
        const stem = dot > 0 ? name.slice(0, dot) : name;
        const ext = dot > 0 ? name.slice(dot) : '';
        let candidate = name;
        let index = 2;
        while (used.has(candidate)) candidate = stem + ' (' + index++ + ')' + ext;
        used.add(candidate);
        return candidate;
      }

      // 建立不需外部函式庫的 ZIP（圖片本身已壓縮，因此使用無壓縮封裝）。
      async function buildZip(entries) {
        const encoder = new TextEncoder();
        const chunks = [];
        const central = [];
        let offset = 0;
        for (const entry of entries) {
          const data = new Uint8Array(await entry.blob.arrayBuffer());
          const nameBytes = encoder.encode(entry.name);
          const crc = crc32(data);
          const local = new Uint8Array(30 + nameBytes.length);
          writeU32(local, 0, 0x04034b50);
          writeU16(local, 4, 20);
          writeU16(local, 6, 0x0800);
          writeU16(local, 8, 0);
          writeU16(local, 10, 0);
          writeU16(local, 12, 0);
          writeU32(local, 14, crc);
          writeU32(local, 18, data.length);
          writeU32(local, 22, data.length);
          writeU16(local, 26, nameBytes.length);
          writeU16(local, 28, 0);
          local.set(nameBytes, 30);
          chunks.push(local, data);
          const record = new Uint8Array(46 + nameBytes.length);
          writeU32(record, 0, 0x02014b50);
          writeU16(record, 4, 20);
          writeU16(record, 6, 20);
          writeU16(record, 8, 0x0800);
          writeU16(record, 10, 0);
          writeU16(record, 12, 0);
          writeU16(record, 14, 0);
          writeU32(record, 16, crc);
          writeU32(record, 20, data.length);
          writeU32(record, 24, data.length);
          writeU16(record, 28, nameBytes.length);
          writeU16(record, 30, 0);
          writeU16(record, 32, 0);
          writeU16(record, 34, 0);
          writeU16(record, 36, 0);
          writeU32(record, 38, 0);
          writeU32(record, 42, offset);
          record.set(nameBytes, 46);
          central.push(record);
          offset += local.length + data.length;
        }
        const centralSize = central.reduce((sum, chunk) => sum + chunk.length, 0);
        const end = new Uint8Array(22);
        writeU32(end, 0, 0x06054b50);
        writeU16(end, 4, 0);
        writeU16(end, 6, 0);
        writeU16(end, 8, entries.length);
        writeU16(end, 10, entries.length);
        writeU32(end, 12, centralSize);
        writeU32(end, 16, offset);
        writeU16(end, 20, 0);
        return new Blob([...chunks, ...central, end], { type: 'application/zip' });
      }

      function writeU16(array, offset, value) {
        array[offset] = value & 255;
        array[offset + 1] = (value >>> 8) & 255;
      }
      function writeU32(array, offset, value) {
        array[offset] = value & 255;
        array[offset + 1] = (value >>> 8) & 255;
        array[offset + 2] = (value >>> 16) & 255;
        array[offset + 3] = (value >>> 24) & 255;
      }
      function crc32(bytes) {
        let crc = 0xffffffff;
        for (let i = 0; i < bytes.length; i++) {
          crc ^= bytes[i];
          for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
        }
        return (crc ^ 0xffffffff) >>> 0;
      }
    })();
  </script>
</body>
</html>
